name: Shahab Radar Scanner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shahab-radar-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger backend market scan
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 90 -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            'https://shahab-trade.webjiko.workers.dev/api/scan/run')"
          echo "$response"
          echo "$response" | jq -e '.ok == true' >/dev/null
