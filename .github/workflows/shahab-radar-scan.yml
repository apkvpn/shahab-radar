name: Shahab Radar Manual Scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run one manual scanner batch
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --connect-timeout 10 --max-time 90 -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            'https://shahab-trade.webjiko.workers.dev/api/scan/run')"
          echo "$response"
          echo "$response" | jq -e '.ok == true' >/dev/null
