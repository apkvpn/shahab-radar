<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Shahab Radar — daily crypto signal radar. Gate.io data fetched and analysed directly in the browser.">
<title>Shahab Radar</title>

<style>
  :root{
    --bg:#f5f6f7; --card:#fff; --line:#e4e6ea; --ink:#0b0b0c; --muted:#6b7280;
    --lime:#a3e635; --lime-d:#65a30d; --lime-soft:#f2fce0;
    --green:#16a34a; --red:#ef4444; --blue:#0284c7;
    --radius:16px; --shadow:0 8px 30px rgba(15,23,42,.07);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif}
  body{overflow-x:clip;-webkit-tap-highlight-color:transparent}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px}
  .brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .brand .mark{width:32px;height:32px;border-radius:10px;background:#111214;display:grid;place-items:center}
  .brand b{font-size:17px;letter-spacing:-.01em}
  .brand b span{color:var(--lime-d)}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
  .pill.live{background:#ecfeff;color:#0e7490}
  .pill.warn{background:#fffbeb;color:#a16207}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .top .actions{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#1f2328;
    border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;transition:.15s}
  .btn:hover{background:#f8fafc}
  .btn.primary{background:var(--lime);border-color:var(--lime);color:#000}
  .btn.primary:hover{background:#bef264}

  /* ---------- scan line ---------- */
  .scanline{display:flex;align-items:center;gap:10px;padding:0 14px 9px}
  .scanline .k{font-size:10.5px;font-weight:800;color:#475569;white-space:nowrap}
  .scanline .bar{flex:1;height:5px;border-radius:999px;background:#eef1f5;overflow:hidden;min-width:70px}
  .scanline .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a3e635,#65a30d);transition:width .3s}
  .scanline .t{font-size:10.5px;color:#475569;white-space:nowrap;font-weight:700}

  /* ---------- cards ---------- */
  main{max-width:1180px;margin:0 auto;padding:12px;display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card h2{margin:0;font-size:13px;font-weight:800}
  .card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;
    background:#f1f5f9;color:#475569;white-space:nowrap}
  .chip.lime{background:var(--lime-soft);color:#4d7c0f}
  .chip.green{background:#ecfdf5;color:#047857}
  .chip.red{background:#fef2f2;color:#b91c1c}
  .chip.amber{background:#fffbeb;color:#b45309}
  .muted{color:var(--muted);font-size:11px}

  /* ---------- signal strip ---------- */
  .strip{display:flex;gap:10px;overflow-x:auto;padding:12px;direction:rtl;scroll-snap-type:x proximity;
    scrollbar-width:thin}
  .strip::-webkit-scrollbar{height:8px}
  .strip::-webkit-scrollbar-thumb{background:#d7dbe2;border-radius:99px}
  .sig{flex:0 0 auto;width:190px;direction:ltr;scroll-snap-align:start;
    display:grid;gap:7px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;
    text-align:left;transition:.15s}
  .sig:hover{border-color:#cbd5e1;box-shadow:0 6px 18px rgba(15,23,42,.07);transform:translateY(-1px)}
  .sig.fresh{border-color:var(--lime);background:linear-gradient(180deg,#fafff2,#fff 60%)}
  .sig-head{display:flex;align-items:center;gap:6px;justify-content:space-between}
  .sig .sym{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .tag{font-size:9px;font-weight:800;border-radius:5px;padding:2px 6px;background:#f1f5f9;color:#64748b;white-space:nowrap}
  .tag.d1{background:#eef2ff;color:#4338ca}
  .badge-new{font-size:9px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--lime);color:#111;white-space:nowrap}
  .sig-status{font-size:10.5px;font-weight:800;border-radius:8px;padding:4px 8px;text-align:center}
  .sig-status.tp{background:#ecfdf5;color:#047857}
  .sig-status.sl{background:#fef2f2;color:#b91c1c}
  .sig-status.open{background:#f8fafc;color:#475569}
  .sig-rows{display:grid;gap:3px;font-size:10.5px;color:#64748b}
  .sig-rows span{display:flex;align-items:baseline;gap:6px}
  .sig-rows span > b{margin-left:auto}
  .sig-rows b{color:#0b0b0c;font-weight:800}
  .sig-rows i{font-style:normal;color:#94a3b8}
  .sig-rows em{font-style:normal;font-weight:800;width:26px;display:inline-block}
  .sig-foot{font-size:10px;color:#94a3b8;border-top:1px solid #f1f3f6;padding-top:6px;display:flex;
    justify-content:space-between;gap:8px}

  /* ---------- chart ---------- */
  .chart-card .card-head{gap:10px}
  .sym-title{font-size:18px;font-weight:800}
  #chart{height:min(64dvh,540px);min-height:300px;width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:#475569;align-items:center}
  .legend i{display:inline-block;width:14px;height:0;border-top:2px solid;margin-right:5px;vertical-align:middle}

  .boot{padding:14px;font-size:12px;color:#475569;display:flex;align-items:center;gap:10px}
  footer{max-width:1180px;margin:0 auto;padding:0 14px 18px;color:#94a3b8;font-size:11px;display:flex;flex-wrap:wrap;gap:10px}

  @media (min-width:900px){ .sig{width:200px} }
</style>
</head>
<body>

<main>

  <section class="card chart-card">

    <div id="chart"></div>
    <div class="legend">
      <span><i style="border-color:#22c55e"></i>Support</span>
      <span><i style="border-color:#94a3b8"></i>Midline = TP target</span>
      <span><i style="border-color:#f87171"></i>Resistance</span>
      <span>Entry = signal close</span>
      <span>Stop = 25% below entry</span>
    </div>
  </section>
</main>

<footer>
  <span>Data: Gate.io — fetched directly in your browser</span>
  <span>·</span>
  <span>Signals calculated in your browser</span>
  <span>·</span>
  <span id="updated">—</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
<script type="module">
/* ENGINE-START */
/* ============================================================================
   SIGNAL ENGINE — daily only
   Support band = smoothed close ± MULT·ATR, midline from the ALMA smoothing.
   A signal fires when the low pierces support and the candle closes back above
   it. Entry = that close. TP = the grey midline. Stop = 25% below entry.
   Outcome: TP when price touches the midline, STOP when price trades 25% below
   entry first, OPEN while neither has happened.
   ============================================================================ */
const W = 80, BANDWIDTH = 2, OFFSET = 0.85, SIGMA = 8, ATR_LEN = 100, MULT = 4;
const STOP_PCT = 0.25, TREND_LOOKBACK = 5;

const KERNEL = (() => {
  const w = []; let sum = 0;
  for (let k = 0; k < W; k++) { const v = Math.exp(-(k * k) / (2 * BANDWIDTH * BANDWIDTH)); w.push(v); sum += v; }
  return w.map(v => v / sum);
})();
const ALMA = (() => {
  const m = Math.floor(OFFSET * (W - 1)), s = W / SIGMA;
  const w = []; let sum = 0;
  for (let i = 0; i < W; i++) { const v = Math.exp(-((i - m) * (i - m)) / (2 * s * s)); w.push(v); sum += v; }
  return w.map(v => v / sum);
})();

const valid = c => c && [c.o, c.h, c.l, c.c].every(n => Number.isFinite(n) && n > 0)
  && c.h + c.h * 1e-12 >= Math.max(c.o, c.c) && c.l - c.h * 1e-12 <= Math.min(c.o, c.c) && c.h >= c.l;

function bands(candles) {
  const n = candles.length;
  const nw = new Array(n).fill(NaN), mid = new Array(n).fill(NaN), atr = new Array(n).fill(NaN);
  const sup = new Array(n).fill(NaN), res = new Array(n).fill(NaN);
  for (let i = W - 1; i < n; i++) { let acc = 0; for (let k = 0; k < W; k++) acc += candles[i - k].c * KERNEL[k]; nw[i] = acc; }
  for (let i = 2 * W - 2; i < n; i++) {
    let acc = 0; const base = i - (W - 1);
    for (let j = 0; j < W; j++) acc += nw[base + j] * ALMA[j];
    mid[i] = acc;
  }
  let rma = NaN, seed = 0;
  for (let i = 0; i < n; i++) {
    const c = candles[i], pc = i > 0 ? candles[i - 1].c : NaN;
    const tr = Number.isFinite(pc) ? Math.max(c.h - c.l, Math.abs(c.h - pc), Math.abs(c.l - pc)) : c.h - c.l;
    if (i < ATR_LEN) { seed += tr; if (i === ATR_LEN - 1) { rma = seed / ATR_LEN; atr[i] = rma; } }
    else { rma = (rma * (ATR_LEN - 1) + tr) / ATR_LEN; atr[i] = rma; }
  }
  for (let i = 0; i < n; i++) if (Number.isFinite(mid[i]) && Number.isFinite(atr[i])) {
    sup[i] = mid[i] - MULT * atr[i]; res[i] = mid[i] + MULT * atr[i];
  }
  return { mid, sup, res, atr };
}

/* entry = close, TP = grey midline, stop = 25% below entry */
function analyze(candles) {
  const b = bands(candles);
  const { mid, sup, atr } = b;
  const signals = [], last = candles.length - 1;
  for (let i = 1; i < candles.length; i++) {
    const c = candles[i], p = candles[i - 1];
    if (!c.x && i !== last) continue;
    if (!valid(c) || !valid(p)) continue;
    const s = sup[i], ps = sup[i - 1];
    if (!Number.isFinite(s) || !Number.isFinite(ps) || !Number.isFinite(atr[i])) continue;
    if (!(c.l < s && p.l >= ps)) continue;
    if (!(mid[i] > c.c)) continue;                    // TP must sit above the entry
    const reclaim = c.c > s;
    const trendUp = Number.isFinite(mid[i - TREND_LOOKBACK]) && mid[i] > mid[i - TREND_LOOKBACK];
    signals.push({
      i, t: c.t, entry: c.c, support: s, mid: mid[i], resistance: b.res[i], atr: atr[i],
      quality: reclaim && trendUp, live: !c.x,
      tp: mid[i], sl: c.c * (1 - STOP_PCT),
    });
  }
  return { ...b, signals };
}

/* walk a signal forward: stop first (conservative), then the midline target */
function settle(candles, s) {
  const lastClose = candles[candles.length - 1].c;
  for (let j = s.i + 1; j < candles.length; j++) {
    const c = candles[j];
    if (c.l <= s.sl) return { ...s, outcome: "STOP", days: j - s.i, pnlPct: -STOP_PCT * 100 };
    if (c.h >= s.tp) return { ...s, outcome: "TP", days: j - s.i, pnlPct: (s.tp / s.entry - 1) * 100 };
  }
  return { ...s, outcome: "OPEN", days: null, pnlPct: (lastClose / s.entry - 1) * 100 };
}
/* ENGINE-END */

const sleep = ms => new Promise(r => setTimeout(r, ms));
const HOST = "https://api.gateio.ws";
const UNIVERSE = 1000;
const BATCH = 110;
const TTL = 20 * 60_000, CONC = 6;
const D1 = { k: "1d", iv: "1d", ms: 864e5, bars: 500 };
const CHART_BARS = 900;
const STABLE = new Set("usdt usdc dai tusd busd fdusd usde usds usdd pyusd usdg rlusd lusd susd usdp eurc eurt frax gho usdb usdx ousd mim usd1".split(" "));
const toPair = s => s.includes("_") ? s.toUpperCase() : `${s.replace(/USDT$/i, "")}_USDT`.toUpperCase();

/* Gate throttles a browser that fires thousands of calls, and a refused call
   arrives without CORS headers. Every request therefore takes a slot in one
   global queue whose gap widens whenever Gate starts pushing back. */
let nextSlot = 0, gap = 130;
async function api(path, params, tries = 3, priority = false) {
  const qs = new URLSearchParams(Object.entries(params || {}).map(([k, v]) => [k, String(v)]));
  const url = `${HOST}${path}?${qs}`;
  if (priority) nextSlot = Date.now();
  for (let a = 0; a < tries; a++) {
    const now = Date.now();
    const wait = Math.max(0, nextSlot - now);
    nextSlot = Math.max(now, nextSlot) + gap;
    if (wait > 0) await sleep(wait);
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.ok) { gap = Math.max(110, gap - 4); return await res.json(); }
      if (res.status === 429) { gap = Math.min(900, Math.round(gap * 1.7)); await sleep(1500); continue; }
      throw new Error("gate_" + res.status);
    } catch (e) {
      gap = Math.min(900, Math.round(gap * 1.4));
      await sleep(500 * (a + 1) + Math.round(Math.random() * 400));
    }
  }
  throw new Error("gate_failed");
}

function parse(rows, tfMs) {
  if (!Array.isArray(rows)) return [];
  const out = [];
  for (const r of rows) {
    const t = Number(r[0]) * 1000;
    const close = Number(r[2]), high = Number(r[3]), low = Number(r[4]), open = Number(r[5]), vol = Number(r[6]);
    if (![t, open, high, low, close].every(Number.isFinite)) continue;
    if (!(open > 0 && high > 0 && low > 0 && close > 0) || high < low) continue;
    out.push({ t, o: open, h: high, l: low, c: close, v: Number.isFinite(vol) ? vol : 0,
      x: r[7] === "true" || r[7] === true || t + tfMs + 60_000 < Date.now() });
  }
  return out.sort((a, b) => a.t - b.t);
}

async function universe() {
  const list = await api("/api/v4/spot/tickers", {});
  if (!Array.isArray(list)) throw new Error("bad_tickers");
  const seen = new Set(), ranked = [];
  for (const r of list) {
    const cp = String(r.currency_pair || "").toUpperCase();
    if (!cp.endsWith("_USDT")) continue;
    const base = cp.slice(0, -5);
    if (!/^[A-Z0-9]{2,15}$/.test(base) || STABLE.has(base.toLowerCase()) || seen.has(base)) continue;
    if (/(3L|3S|5L|5S|UP|DOWN|BULL|BEAR)$/.test(base)) continue;
    const price = Number(r.last ?? r.lowest_ask), vol = Number(r.quote_volume ?? r.base_volume);
    if (!(price > 0) || !Number.isFinite(vol) || vol <= 0) continue;
    const chg = Number(r.change_percentage);
    seen.add(base);
    ranked.push({ symbol: base, pair: cp, price, volume: vol, change: Number.isFinite(chg) ? chg : null });
  }
  ranked.sort((a, b) => b.volume - a.volume);
  return ranked.slice(0, UNIVERSE).map((m, i) => ({ ...m, rank: i + 1 }));
}

async function candles(pair, bars, priority = false) {
  const rows = await api("/api/v4/spot/candlesticks", {
    currency_pair: toPair(pair), interval: D1.iv, limit: Math.min(1000, Math.max(200, bars)),
  }, priority ? 5 : 3, priority);
  return parse(rows, D1.ms).slice(-bars);
}

/* ---- snapshot cache -------------------------------------------------------- */
const KEY = "shahab-radar-d1-v6";
let snap = null;
function loadCache() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.at && Date.now() - d.at < TTL && d.markets?.length ? d : null;
  } catch { return null; }
}
function saveCache() {
  try { if (snap) localStorage.setItem(KEY, JSON.stringify(snap)); } catch {}
}

/* ============================================================================
   STATE
   ============================================================================ */
const state = {
  markets: [], signals: [], at: 0, cursor: 0, round: 0, gen: 0, scannedRound: 0,
  busy: false, total: 0, scanned: 0, strict: true, charts: new Map(), focusT: null, drawSeq: 0, selectedSymbol: null,
};
const $ = id => document.getElementById(id);
const fmt = v => v == null || !Number.isFinite(v) ? "—"
  : Math.abs(v) >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 2 })
  : v.toLocaleString("en-US", { maximumSignificantDigits: 6 });
const pct = v => v == null || !Number.isFinite(v) ? "—" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
const dayKey = t => new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const stamp = t => `${dayKey(t)} ${new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false })}`;

function paintStatus(text, tone) {
  $("status").className = `pill ${tone || "warn"}`;
  $("statusText").textContent = text;
}
function setProgress(frac, text) {
  $("scanBar").style.width = `${Math.round(Math.min(1, Math.max(0, frac)) * 100)}%`;
  if (text) $("scanText").textContent = text;
}

/* ============================================================================
   SIGNAL STRIP — newest on the right, older to the left
   ============================================================================ */
function outcomeChip(s) {
  if (s.outcome === "TP") return `<span class="sig-status tp">TP hit${s.days ? ` · ${s.days}d` : ""}</span>`;
  if (s.outcome === "STOP") return `<span class="sig-status sl">Stopped${s.days ? ` · ${s.days}d` : ""}</span>`;
  return `<span class="sig-status open">Open</span>`;
}

function renderSignals() {
  const box = $("signals");
  const list = state.signals.slice().sort((a, b) => b.candleTime - a.candleTime);
  $("sigCount").textContent = `${list.length} signals`;
  $("sigNote").textContent = state.strict ? "Quality filter on · close back above support + rising midline" : "All support breaks";
  if (!list.length) {
    box.innerHTML = `<div class="boot"><span>${state.busy ? "Scanning markets…" : "No signal matches this filter."}</span></div>`;
    return;
  }
  const weekAgo = Date.now() - 7 * 864e5;
  const frag = document.createDocumentFragment();
  for (const s of list) {
    const fresh = s.candleTime >= weekAgo;
    const toTp = ((s.tp / s.entry) - 1) * 100;
    const b = document.createElement("button");
    b.className = `sig${fresh ? " fresh" : ""}`;
    b.innerHTML = `
      <span class="sig-head">
        <span style="display:flex;align-items:center;gap:6px">
          <span class="sym num">${s.symbol}</span>
          <span class="tag d1">D1</span>
        </span>
        ${fresh ? `<span class="badge-new">New Signal</span>` : ""}
      </span>
      ${outcomeChip(s)}
      <span class="sig-rows num">
        <span>Entry <b>${fmt(s.entry)}</b></span>
        <span><em style="color:#047857">TP</em> <b>${fmt(s.tp)}</b> <i>${pct(toTp)}</i></span>
        <span><em style="color:#b91c1c">SL</em> <b>${fmt(s.sl)}</b> <i>−25%</i></span>
      </span>
      <span class="sig-foot num">
        <span>${stamp(s.candleTime)}</span>
        <span>${s.outcome === "OPEN" ? pct(s.pnlPct) : `${s.days}d`}</span>
      </span>`;
    b.onclick = () => {
      $("chartSym").scrollIntoView({ behavior: "smooth", block: "center" });
      selectSymbol(s.symbol, s.candleTime / 1000);
    };
    frag.appendChild(b);
  }
  box.innerHTML = "";
  box.appendChild(frag);
}

/* ============================================================================
   SCAN — continuous sweep of every market, one minute rest, repeat
   ============================================================================ */
async function loadUniverse(force) {
  const cached = !force && loadCache();
  if (cached) {
    state.markets = cached.markets; state.signals = cached.signals || [];
    state.at = cached.at; state.cursor = cached.cursor || 0; state.round = cached.round || 0;
    state.total = cached.markets.length; state.scanned = cached.markets.filter(m => m.scannedAt).length;
    renderAll();
    paintStatus("Live", "live");
    if (Date.now() - cached.at < 60_000) return;
  }
  const markets = await universe();
  const prev = new Map(state.markets.map(m => [m.symbol, m]));
  state.markets = markets.map(m => {
    const old = prev.get(m.symbol);
    return old ? { ...m, sig: old.sig || null, scannedAt: old.scannedAt || 0 } : { ...m, sig: null, scannedAt: 0 };
  });
  state.total = state.markets.length;
  rebuildSignals();
  renderAll();
}

function rebuildSignals() {
  const out = [];
  for (const m of state.markets) if (m.sig) out.push(m.sig);
  state.signals = out;
}

async function scanSlice() {
  if (state.busy || !state.markets.length) return;
  state.busy = true;
  paintStatus("Scanning", "warn");
  const total = state.markets.length;
  const start = state.cursor % total;
  const slice = [];
  for (let i = 0; i < Math.min(BATCH, total); i++) slice.push(state.markets[(start + i) % total]);
  state.cursor = (start + slice.length) % total;
  if (state.cursor < start) state.round++;
  if (start === 0) state.scannedRound = 0;

  let done = 0;
  const queue = [...slice];
  const worker = async () => {
    for (;;) {
      const m = queue.shift();
      if (!m) return;
      try {
        const own = await candles(m.pair, D1.bars);
        m.sig = null;
        if (own.length >= 2 * W + 10) {
          const a = analyze(own);
          const sig = a.signals[a.signals.length - 1];
          if (sig && (!state.strict || sig.quality)) {
            const out = settle(own, sig);
            m.sig = {
              id: `${m.symbol}-${sig.t}`, symbol: m.symbol, rank: m.rank,
              entry: sig.entry, tp: sig.tp, sl: sig.sl, support: sig.support,
              candleTime: sig.t, quality: sig.quality, live: sig.live,
              outcome: out.outcome, days: out.days, pnlPct: out.pnlPct,
            };
          }
        }
        m.scannedAt = Date.now();
      } catch (e) { /* a market that fails keeps its previous state */ }
      done++; state.scanned++; state.scannedRound++;
      setProgress(state.scannedRound / slice.length,
        `Round ${state.round + 1} · ${state.scannedRound} of ${total} markets`);
      if (done % 10 === 0) { rebuildSignals(); renderSignals(); }
    }
  };
  await Promise.all(Array.from({ length: CONC }, worker));
  state.busy = false;

  rebuildSignals();
  renderAll();
  paintStatus("Live", "live");
  state.at = Date.now();
  snap = { at: state.at, cursor: state.cursor, round: state.round, markets: state.markets, signals: state.signals };
  saveCache();
}

async function runRounds() {
  const gen = ++state.gen;
  for (;;) {
    const r0 = state.round;
    while (state.round === r0) {
      if (state.gen !== gen || !state.markets.length) return;
      if (state.busy) { await sleep(300); continue; }
      await scanSlice();
    }
    if (state.gen !== gen) return;
    paintStatus("Paused 1 min", "warn");
    setProgress(1, `Round ${state.round} finished · restarting in 1 minute`);
    await sleep(60_000);
  }
}

/* ============================================================================
   CHART
   ============================================================================ */
let chartApi = null, candleSeries = null, bandS = null, markersApi = null, priceLines = [];

function initChart() {
  const chart = LightweightCharts.createChart($("chart"), {
    autoSize: true,
    layout: { background: { type: "solid", color: "#ffffff" }, textColor: "#131722", fontFamily: "ui-sans-serif, system-ui, sans-serif", fontSize: 11, attributionLogo: true },
    grid: { vertLines: { visible: false }, horzLines: { color: "#f4f6f9" } },
    rightPriceScale: { borderVisible: false, entireTextOnly: true, scaleMargins: { top: 0.16, bottom: 0.16 } },
    timeScale: { borderVisible: false, timeVisible: false, rightOffset: 5, barSpacing: 9, minBarSpacing: 1.2 },
    crosshair: { mode: 0, vertLine: { visible: false, labelVisible: false }, horzLine: { labelVisible: false } },
  });
  candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
    wickUpColor: "#26a69a", wickDownColor: "#ef5350", priceLineVisible: false,
  });
  const line = (color, width, style) => chart.addSeries(LightweightCharts.LineSeries, {
    color, lineWidth: width, lineStyle: style, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false, autoscaleInfoProvider: () => null,
  });
  bandS = {
    sup: line("#22c55e", 1, LightweightCharts.LineStyle.Dashed),
    mid: line("#94a3b8", 1, LightweightCharts.LineStyle.Solid),
    res: line("#f87171", 1, LightweightCharts.LineStyle.Dashed),
  };
  markersApi = LightweightCharts.createSeriesMarkers(candleSeries, []);
  chartApi = chart;
}

async function selectSymbol(symbol, focusT) {
  const seq = ++state.drawSeq;          // a slower earlier load must not overwrite the chart
  state.selectedSymbol = symbol;
  state.focusT = focusT == null ? null : focusT;
  $("chartSym").textContent = symbol;
  $("chartState").textContent = "…";
  $("chartState").className = "chip";
  try {
    let own = state.charts.get(symbol);
    if (!own) {
      own = await candles(symbol, CHART_BARS, true);
      state.charts.set(symbol, own);
    }
    if (seq !== state.drawSeq) return;
    drawChart(symbol, own);
    setTimeout(() => { if (seq === state.drawSeq) drawChart(symbol, own); }, 120);
  } catch (e) {
    $("chartRange").textContent = "History unavailable for this market";
  }
}

function drawChart(symbol, c) {
  if (!chartApi || !c.length) return;
  const res = analyze(c);
  const settled = res.signals.map(s => settle(c, s));
  const focusIdx = state.focusT == null ? -1
    : settled.findIndex(s => Math.floor(s.t / 1000) === Math.floor(state.focusT));
  const focusSig = focusIdx >= 0 ? settled[focusIdx] : settled[settled.length - 1];

  candleSeries.setData(c.map(k => ({ time: Math.floor(k.t / 1000), open: k.o, high: k.h, low: k.l, close: k.c })));
  const pts = arr => arr.map((v, i) => ({ time: Math.floor(c[i].t / 1000), value: v })).filter(p => Number.isFinite(p.value));
  bandS.sup.setData(pts(res.sup));
  bandS.mid.setData(pts(res.mid));
  bandS.res.setData(pts(res.res));

  /* every daily signal is marked: target hit, stopped, still open */
  markersApi.setMarkers(settled.map(s => {
    const t = Math.floor(s.t / 1000);
    const isFocus = focusSig && Math.floor(focusSig.t / 1000) === t;
    const hit = s.outcome === "TP" ? { position: "aboveBar", shape: "arrowDown", color: "#16a34a" }
      : s.outcome === "STOP" ? { position: "belowBar", shape: "arrowDown", color: "#ef4444" }
      : { position: "belowBar", shape: "arrowUp", color: "#eab308" };
    return {
      time: t, position: hit.position, shape: hit.shape, color: hit.color,
      size: isFocus ? 2 : 1.2,
      text: isFocus ? (s.outcome === "TP" ? "TP" : s.outcome === "STOP" ? "STOP" : "OPEN") : "",
    };
  }));

  for (const pl of priceLines) { try { candleSeries.removePriceLine(pl); } catch {} }
  priceLines = [];
  if (focusSig) {
    const add = (price, color, title, style) => {
      const pl = candleSeries.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title });
      priceLines.push(pl);
    };
    add(focusSig.tp, "#16a34a", `TP ${pct((focusSig.tp / focusSig.entry - 1) * 100)}`, LightweightCharts.LineStyle.Dotted);
    add(focusSig.entry, "#475569", "Entry", LightweightCharts.LineStyle.Solid);
    add(focusSig.sl, "#ef4444", "SL −25%", LightweightCharts.LineStyle.Dashed);
  }

  /* readable window around the selected signal, or the latest candles */
  const n = c.length, viewBars = 170;
  const ts = chartApi.timeScale();
  let from, to;
  if (focusSig && state.focusT != null) {
    let idx = c.findIndex(k => Math.floor(k.t / 1000) >= Math.floor(state.focusT));
    if (idx < 0) idx = n - 1;
    from = Math.max(0, idx - Math.round(viewBars * 0.62));
    to = Math.min(n + 6, Math.max(from + viewBars, idx + 26));
    if (to - from < viewBars) from = Math.max(0, to - viewBars);
  } else {
    from = Math.max(0, n + 6 - viewBars);
    to = n + 6;
  }
  ts.setVisibleLogicalRange({ from, to });

  const m = state.markets.find(x => x.symbol === symbol);
  const last = c[c.length - 1];
  $("chartPrice").textContent = fmt(m ? (m.price ?? last.c) : last.c);
  const chg = m ? m.change : null;
  $("chartChange").textContent = chg == null ? "" : pct(chg);
  $("chartChange").className = `num ${chg == null ? "" : chg >= 0 ? "up" : "down"}`;
  $("chartChange").style.color = chg == null ? "" : chg >= 0 ? "#16a34a" : "#ef4444";
  if (focusSig) {
    $("chartState").className = `chip ${focusSig.outcome === "TP" ? "green" : focusSig.outcome === "STOP" ? "red" : "amber"}`;
    $("chartState").textContent = focusSig.outcome === "TP" ? `TP hit in ${focusSig.days}d`
      : focusSig.outcome === "STOP" ? `Stopped in ${focusSig.days}d` : "Signal open";
  }
  $("chartRange").textContent = `D1 · ${c.length} candles · ${dayKey(c[0].t)} → ${dayKey(last.t)}`;
}

/* ============================================================================
   WIRING
   ============================================================================ */
function renderAll() {
  renderSignals();
  $("updated").textContent = state.total
    ? `Round ${state.round + 1} · ${Math.min(state.scannedRound, state.total)} of ${state.total} markets`
    : "—";
  /* open the chart on the newest signal as soon as one exists */
  if (!state.selectedSymbol && state.signals.length) {
    const newest = state.signals.slice().sort((a, b) => b.candleTime - a.candleTime)[0];
    selectSymbol(newest.symbol, newest.candleTime / 1000);
  }
}

function tickCountdown() {
  const ms = D1.ms - (Date.now() % D1.ms);
  const h = Math.floor(ms / 3600e3), mi = Math.floor((ms % 3600e3) / 60e3);
  $("countdown").textContent = `Next daily candle in ${h}h ${mi}m`;
}

$("refresh").onclick = async () => {
  localStorage.removeItem(KEY);
  state.charts.clear(); state.cursor = 0; state.round = 0; state.scanned = 0;
  setProgress(0, "Loading markets…");
  await loadUniverse(true);
  runRounds();
};
$("mode").onclick = async () => {
  state.strict = !state.strict;
  $("mode").textContent = `Quality: ${state.strict ? "High" : "All"}`;
  state.markets.forEach(m => { m.sig = null; });
  rebuildSignals();
  renderSignals();
  localStorage.removeItem(KEY);
  state.cursor = 0; state.round = 0; state.scannedRound = 0;
  runRounds();
};

window.__radar = { state, candles, toPair, analyze, settle, scanSlice, loadUniverse };

(async function boot() {
  initChart();
  tickCountdown();
  try {
    await loadUniverse(false);
  } catch (e) {
    paintStatus("Connection error", "warn");
    setProgress(0, "Could not reach Gate.io — try Refresh.");
  }
  runRounds();
  setInterval(tickCountdown, 30_000);
  setInterval(() => { renderSignals(); }, 45_000);
})();
</script>
